name: Package Smoke

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported-node-diagnostic:
    name: Unsupported Node diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust native bridge toolchain
        run: bash scripts/setup-native-toolchain.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup supported Node.js for build
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies and build MCP package
        run: |
          pnpm install --frozen-lockfile
          pnpm build:mcp

      - name: Setup unsupported Node.js for startup check
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.1

      - name: Expose unsupported Node.js through diagnostic MCP
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"unsupported-node-certification","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_huly_startup_diagnostic","arguments":{}}}' \
            | node dist/index.cjs \
              >/tmp/huly-mcp-unsupported-node.stdout \
              2>/tmp/huly-mcp-unsupported-node.stderr

          grep -F "Huly MCP startup failed: unsupported Node.js runtime." /tmp/huly-mcp-unsupported-node.stderr
          grep -F '"instructions":"Huly MCP startup failed: unsupported Node.js runtime.' \
            /tmp/huly-mcp-unsupported-node.stdout
          grep -F '"name":"get_huly_startup_diagnostic"' /tmp/huly-mcp-unsupported-node.stdout
          grep -F '"isError":true' /tmp/huly-mcp-unsupported-node.stdout
          grep -F "Detected 20.20.1" /tmp/huly-mcp-unsupported-node.stdout
          grep -F "required >=22.19.0" /tmp/huly-mcp-unsupported-node.stdout
          grep -F "configure this MCP server's command to a compatible Node.js executable" \
            /tmp/huly-mcp-unsupported-node.stdout

  packed-package:
    name: Packed package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.2
          - 24.15.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust native bridge toolchain
        run: bash scripts/setup-native-toolchain.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Effect dependency cohort
        run: pnpm verify:effect-cohort

      - name: Build package
        run: pnpm build

      - name: Verify bundled version
        run: pnpm verify-version

      - name: Verify x64 native bridge and shared backend lifecycles
        run: |
          set -euo pipefail
          pnpm test:native
          child_cache="$(mktemp -d)"
          trap 'rm -rf "$child_cache"' EXIT
          HULY_TEST_SUBPROCESS_COMPILE_CACHE="$child_cache" pnpm exec vitest run \
            test/resident/managed-backend-process.test.ts \
            test/resident/native-backend-process.test.ts

      - name: Smoke HTTP no-config resource inspection
        run: pnpm smoke:http-no-config

      - name: Pack package
        run: |
          mkdir -p .package-smoke
          npm_config_ignore_scripts=true pnpm pack --pack-destination .package-smoke
          tarball="$(realpath "$(ls .package-smoke/*.tgz | head -n 1)")"
          version="$(node -p "require('./package.json').version")"
          node scripts/run-bundled.mjs scripts/certify-packed-artifact.ts "$tarball" mcp "$version"

      - name: Preserve failed packed-artifact diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packed-artifact-diagnostics-${{ matrix.node-version }}
          include-hidden-files: true
          path: .package-smoke/*.tgz
          retention-days: 7

      - name: Install and discover packed package
        run: |
          set -euo pipefail

          repo_root="$PWD"
          tarball="$(realpath "$(ls .package-smoke/*.tgz | head -n 1)")"
          expected_version="$(node -p "require('./package.json').version")"
          smoke_dir="$(mktemp -d)"

          cd "$smoke_dir"
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add --no-optional "$tarball"
          pnpm list --prod --no-optional --json --depth Infinity > resolved-dependencies.json
          node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/certify-installed-dependencies.ts" \
            resolved-dependencies.json @firfi/huly-mcp

          node <<'NODE'
          const { readFileSync } = require("node:fs")

          const packageJson = JSON.parse(readFileSync("node_modules/@firfi/huly-mcp/package.json", "utf8"))
          const expectedBin = { "huly-mcp": "./dist/index.cjs" }

          if (JSON.stringify(packageJson.bin) !== JSON.stringify(expectedBin)) {
            throw new Error(`Unexpected package bin metadata: ${JSON.stringify(packageJson.bin)}`)
          }
          NODE

          timeout 20 node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/smoke-packed-mcp.ts" \
            "$(pwd)/node_modules/.bin/huly-mcp" "$expected_version"

          npm_smoke_dir="$(mktemp -d)"
          cd "$npm_smoke_dir"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --omit=optional "$tarball"
          npm ls --all --json > resolved-dependencies.json
          node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/certify-installed-dependencies.ts" \
            resolved-dependencies.json @firfi/huly-mcp

          timeout 20 node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/smoke-packed-mcp.ts" \
            "$(pwd)/node_modules/.bin/huly-mcp" "$expected_version"

      - name: Pack CLI package
        run: |
          mkdir -p .package-smoke-cli
          npm_config_ignore_scripts=true pnpm --dir packages/huly-cli pack --pack-destination ../../.package-smoke-cli
          tarball="$(realpath "$(ls .package-smoke-cli/*.tgz | head -n 1)")"
          version="$(node -p "require('./packages/huly-cli/package.json').version")"
          node scripts/run-bundled.mjs scripts/certify-packed-artifact.ts "$tarball" cli "$version"

      - name: Install and inspect packed CLI package
        run: |
          set -euo pipefail

          repo_root="$PWD"
          tarball="$(realpath "$(ls .package-smoke-cli/*.tgz | head -n 1)")"
          expected_version="$(node -p "require('./packages/huly-cli/package.json').version")"
          smoke_dir="$(mktemp -d)"

          cd "$smoke_dir"
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add --no-optional "$tarball"
          pnpm list --prod --no-optional --json --depth Infinity > resolved-dependencies.json
          node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/certify-installed-dependencies.ts" \
            resolved-dependencies.json @firfi/huly-cli

          node - "$expected_version" <<'NODE'
          const { readFileSync } = require("node:fs")

          const expectedVersion = process.argv[2]
          const packageJson = JSON.parse(readFileSync("node_modules/@firfi/huly-cli/package.json", "utf8"))
          const expectedBin = { huly: "./dist/index.cjs" }

          if (packageJson.version !== expectedVersion) {
            throw new Error(`Unexpected CLI package version: ${packageJson.version}`)
          }

          if (JSON.stringify(packageJson.bin) !== JSON.stringify(expectedBin)) {
            throw new Error(`Unexpected CLI package bin metadata: ${JSON.stringify(packageJson.bin)}`)
          }
          NODE

          pnpm exec huly --help > help.log
          grep -q "Huly CLI" help.log
          node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/smoke-packed-cli.ts" \
            "$(pwd)/node_modules/.bin/huly" "$expected_version"

          npm_smoke_dir="$(mktemp -d)"
          cd "$npm_smoke_dir"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --omit=optional "$tarball"
          npm ls --all --json > resolved-dependencies.json
          node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/certify-installed-dependencies.ts" \
            resolved-dependencies.json @firfi/huly-cli

          ./node_modules/.bin/huly --help > help.log
          grep -q "Huly CLI" help.log
          node "$repo_root/scripts/run-bundled.mjs" "$repo_root/scripts/smoke-packed-cli.ts" \
            "$(pwd)/node_modules/.bin/huly" "$expected_version"

          cd "$repo_root"
          pnpm report-cli-artifact-size

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Build Docker image
        run: docker build -t huly-mcp:package-smoke .

      - name: Run Docker image and inspect no-config resources
        run: |
          set -euo pipefail

          container_id="$(docker run -d \
            -e HULY_URL= \
            -e HULY_WORKSPACE= \
            -e HULY_TOKEN= \
            -p 127.0.0.1::8080 \
            huly-mcp:package-smoke)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" || true
          }
          trap cleanup EXIT

          host_port="$(docker port "$container_id" 8080/tcp | sed 's/.*://')"
          MCP_SMOKE_ENDPOINT="http://127.0.0.1:${host_port}/mcp" node scripts/smoke-http-no-config.mjs
