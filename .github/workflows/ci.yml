name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-all:
    name: check-all (Node ${{ matrix.node-version }})
    # Full gates cover x64 and arm64; Package Smoke also checks x64 native lifecycles on both Node versions.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.22.2
            runner: ubuntu-24.04
          - node-version: 24.15.0
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go for native stdio bridge
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Effect dependency cohort
        run: pnpm verify:effect-cohort

      - name: Run quality gate (build, typecheck, circular, lint, test + coverage)
        run: pnpm check-all
      - name: Retain failed quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-quality-diagnostics-node-${{ matrix.node-version }}
          path: |
            coverage/coverage-final.json
            dist/resident-launch-replay-*/failure.json
          if-no-files-found: ignore
          retention-days: 7
