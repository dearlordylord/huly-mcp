name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-all:
    name: check-all (Node ${{ matrix.node-version }})
    # Full gates use arm64; Package Smoke covers x64 packages and native process lifecycles on both Node versions.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.22.2
            runner: ubuntu-24.04-arm
          - node-version: 24.15.0
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go for native stdio bridge
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore transformed test modules
        id: test-transforms
        uses: actions/cache/restore@v4
        with:
          path: .vitest-cache
          key: vitest-${{ runner.os }}-${{ runner.arch }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ runner.arch }}-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts') }}-

      - name: Verify Effect dependency cohort
        run: pnpm verify:effect-cohort

      - name: Run quality gate (build, typecheck, circular, lint, test + coverage)
        run: pnpm check-all
      - name: Save transformed test modules
        if: always() && !cancelled() && steps.test-transforms.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vitest-cache
          key: ${{ steps.test-transforms.outputs.cache-primary-key }}

      - name: Retain failed quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-quality-diagnostics-node-${{ matrix.node-version }}
          path: |
            coverage/coverage-final.json
            dist/resident-launch-replay-*/failure.json
          if-no-files-found: ignore
          retention-days: 7
