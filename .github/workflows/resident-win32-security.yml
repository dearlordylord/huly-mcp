name: Resident Windows security component

on:
  pull_request:
    paths:
      - native/resident-win32/**
      - .github/workflows/resident-win32-security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Native security fixture (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure native security fixture
        run: cmake -S native/resident-win32 -B "${{ runner.temp }}/resident-win32-security" -A x64

      - name: Compile with diagnostics and static analysis
        run: cmake --build "${{ runner.temp }}/resident-win32-security" --config Release --parallel 2

      - name: Exercise actual Windows token and file APIs
        run: ctest --test-dir "${{ runner.temp }}/resident-win32-security" -C Release --output-on-failure

      - name: Retain native build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-win32-security-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/resident-win32-security/CMakeCache.txt
            ${{ runner.temp }}/resident-win32-security/Testing/Temporary/*.log
            ${{ runner.temp }}/resident-win32-security/Release/resident_win32_security_test.exe
