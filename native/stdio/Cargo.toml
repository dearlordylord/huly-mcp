[package]
name = "huly-stdio"
version = "0.55.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
socket2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
