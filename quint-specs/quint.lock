[components.http-transport-admission]
name = "HTTP Transport, Admission & Client Leases"
description = "HTTP `/mcp` serving with bearer/localhost guards, request admission + quiesce drain, per-request Huly client leases, and the process-wide client resolver"
role = "central"
rank = 1
paths = [
    "src/mcp/http-defaults.ts",
    "src/mcp/http-transport.ts",
    "src/mcp/request-admission.ts",
    "src/mcp/request-client-lifecycle.ts",
    "src/runtime/cause-exit.ts",
    "src/runtime/client-resolver.ts",
    "src/runtime/http-client-leases.ts",
    "src/runtime/huly-clients.ts",
]
tests = [
    "test/mcp/http-transport.test.ts",
    "test/mcp/request-admission.test.ts",
    "test/mcp/request-client-lifecycle.test.ts",
    "test/runtime/cause-exit.test.ts",
    "test/runtime/http-client-leases.test.ts",
    "test/runtime/huly-clients.test.ts",
    "test/runtime/scoped-client.test.ts",
]
dependencies = [
    "config",
    "huly-client-connection",
    "tool-response-errors",
]
operations = [
    "`createRequestAdmission()` — mutates (constructor of `{accepting, active}` state, `src/mcp/request-admission.ts:11`)",
    "`RequestAdmission.enter()` — mutates: returns `null` when `!accepting`, else `active++` and a lease (`request-admission.ts:20-21`)",
    "`RequestLease.release()` — mutates, idempotent via `released` flag (`request-admission.ts:26`)",
    "`RequestAdmission.quiesce()` — mutates: `accepting=false`, resolves when `active===0` (`request-admission.ts:34-38`)",
    "`createRequestClientLifecycle(acquire)` — mutates (constructor, `src/mcp/request-client-lifecycle.ts:24`)",
    "`RequestClientLifecycle.resolve()` — mutates: memoized `leasePromise ??= acquire()`; throws if closed before or during acquisition (`request-client-lifecycle.ts:28-34`)",
    "`RequestClientLifecycle.close()` — mutates, idempotent; no-op if never resolved (`request-client-lifecycle.ts:39-55`)",
    "`attachRequestClientLifecycle(server, lifecycle, onCleanupError)` — mutates: wraps `server.onclose`/`server.close`, `Promise.allSettled` both closes, `AggregateError` on double failure (`request-client-lifecycle.ts:64-109`)",
    "`createHttpClientLeaseResolver(layer, resolveEnvClients)(request)` — mutates: header-scoped bundle or shared env bundle with no-op close (`src/runtime/http-client-leases.ts:10-33`)",
    "`buildScopedClientBundle(layer)` — mutates: scope creation under `Effect.uninterruptibleMask` (`src/runtime/huly-clients.ts:63-81`)",
    "`createClientResolver(layer).resolve()` — mutates: memoized acquisition; dies if closed; clears cache only on recoverable `HulyUnavailableError` (`huly-clients.ts:117-140`)",
    "`createClientResolver(layer).prime(scoped)` — mutates: swaps active acquisition and closes the previous; throws if closed (`huly-clients.ts:141-151`)",
    "`createClientResolver(layer).close()` — mutates, idempotent via `closePromise`; closes every tracked acquisition (`huly-clients.ts:154-163`)",
    "`startHttpTransport(config, createServer, writeError)` — mutates: binds server, auth + host/origin guards, `Effect.never` (`src/mcp/http-transport.ts:243-271`)",
    "`createMountedMcpHttpHandler(...).fetch(request)` — mutates: host/origin reject, constant-time bearer check, dispatch (`http-transport.ts:197-215`)",
    "`createMountedMcpHttpHandler(...).close()` — mutates: close handler, drain `activeRequests` and tracked server closes, 5s grace then log-only (`http-transport.ts:218-231`)",
    "`McpServerCloseTracker.track/drain` — mutates (`http-transport.ts:154-182`)",
    "`isAuthorizedMcpRequest`, `extractBearerToken`, `tokenMatches`, `formatHttpAddress`, `httpServeError` — query (pure helpers, `http-transport.ts:113-134`)",
    "`http-defaults.ts` constants (grace period, host/port defaults) — query",
    "`causeExit` helpers (`src/runtime/cause-exit.ts`) — query; `client-resolver.ts` types — query",
]
headlineProperties = [
    "Every per-request client bundle that was acquired is closed exactly once on every exit path (success, failure, client disconnect, server shutdown)",
    "After `quiesce()` no new request is admitted, and `quiesce()` resolves only when `active` reaches 0",
    "`RequestLease.release()` never drives `active` below 0 (double release is a no-op)",
    "A request carrying supported `x-huly-*` override headers never receives the shared env-scoped bundle; requests with no supported override headers use env config, and no request receives another request's header-scoped bundle",
    "After `resolver.close()` no `resolve()`/`prime()` hands out a live client; a non-recoverable acquisition failure stays cached, a `HulyUnavailableError` is retried on the next call",
]
adversarySurface = [
    "Client disconnects while `resolve()` is still acquiring — lifecycle closed mid-acquisition must close the late bundle (`request-client-lifecycle.ts:33-34`)",
    "`prime()` races an in-flight `resolve()`; the `state.active === active` guard decides whether a failure clears the newer acquisition (`huly-clients.ts:132-137`)",
    "Concurrent header-less HTTP requests share one process-scoped Huly client (`http-client-leases.ts:22-23`) — cross-tenant state sharing when env credentials exist",
    "Partial or malformed supported `x-huly-*` headers: provider failure returns a failed bundle; unsupported-only headers return `undefined` and fall back to env — header parsing decides tenant isolation",
    "Server shutdown while requests are in flight: drain exceeds `shutdownGracePeriod` (5s) and is only logged (`http-transport.ts:225-230`) — leaked connections",
    "Both SDK server close and lifecycle close fail: `AggregateError` delivered once via `cleanupErrorReported` (`request-client-lifecycle.ts:95-105`)",
    "Missing/incorrect bearer token, Host/Origin spoofing on localhost binding (`http-transport.ts:123-134,197-205`)",
    "Interrupt during scoped bundle build must still close the scope (`huly-clients.ts:69-70`)",
    "Error-payload fidelity: client-resolution failures must not surface raw tokens from header-scoped config",
]
specHints = "State: `RequestAdmission {accepting: bool, active: int}` + drain waiters (`src/mcp/request-admission.ts:11-38`); `RequestClientLifecycle {leasePromise?, closed, closePromise?}` (`src/mcp/request-client-lifecycle.ts:24-57`); `ClientResolver {active?: acquisition, closed, closePromise?}` + `acquisitions` set (`src/runtime/huly-clients.ts:117-166`). Model actors: N HTTP requests (enter/resolve/release/disconnect), one shutdown actor (quiesce/close), an environment that makes acquisition succeed, fail recoverably (`HulyUnavailableError`) or fail fatally. `resolve` is memoized; recoverable failure clears `state.active` only if it is still the same acquisition (`huly-clients.ts:132-137`). Header routing: `hulyConfigProviderFromHeaders` returns `undefined` when no supported configuration headers are present, including unsupported-only `x-huly-*` metadata; that uses the shared env bundle with no-op close (`src/runtime/http-client-leases.ts:16-24`), while a supported configuration value uses a fresh scoped bundle whose `close` must run. Server close composition: `attachRequestClientLifecycle` wraps `onclose` and `close` and runs both via `Promise.allSettled` (`request-client-lifecycle.ts:64-109`). Shutdown: handler close → drain `activeRequests` → drain tracked server closes → `timeoutOrElse(shutdownGracePeriod)` logs (`src/mcp/http-transport.ts:218-231`). Wiring: `src/index.ts:132-176` owns the resolver via `acquireUseRelease`; eager stdio init primes it (`index.ts:146-153`)."
cardRead = false
connectionsRead = false
