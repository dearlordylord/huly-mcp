headlineProperties = [
    "Shutdown state is monotonic `Running → Quiescing → Closing → Complete` and the first shutdown reason wins",
    "The shutdown body executes at most once even when several callers invoke `execute`",
    "Process clients, telemetry and the stdio wire are each closed at most once and are attempted on every shutdown path",
    "Shutdown completes within the forced deadline (10s): either graceful completion or `forceExit(1)`",
    "stdout carries only JSON-RPC frames once stdio mode starts (console redirected to stderr) and the redirect is restored on exit",
]
adversarySurface = [
    "SIGINT, SIGTERM and stdin EOF arrive together or repeatedly — only the first `request()` wins (`stdio-shutdown.ts:79-80`)",
    "Forced deadline fires while graceful shutdown is mid-close — graceful fiber interrupted before `closeClients` finishes (`stdio-shutdown.ts:134-144`)",
    "A close step hangs or fails — graceful path ignores individual failures, drain timeout ignored (`stdio-shutdown.ts:108-121`)",
    "`forceShutdown` calls `forceExit(1)` before `complete(...)` — `Complete(forced)` observable only with a non-exiting port (`stdio-shutdown.ts:129-131`)",
    "`redirectConsoleToStderr` called twice captures already-redirected methods as originals (`stdio-output.ts:19-36`)",
    "Eager stdio client init fails with a non-`HulyUnavailableError` — process must fail hard, unavailable must defer (`index.ts:146-153`)",
    "Telemetry `shutdown` invoked from both stdio and HTTP shutdown paths has no once-guard (`src/telemetry/posthog.ts:146-153`)",
    "Unsupported Node version: fallback server must answer every request with an error rather than crash or hang",
]
specHints = "State: `StdioShutdownState` tagged union held in a `Ref` (`src/mcp/stdio-shutdown.ts:12-16`) plus `executionClaimed: Ref<boolean>` (`:76`). Actors: process signals (sigint/sigterm/stdin-eof, any order, repeats), N callers of `execute`, a clock (drain allowance 5s, deadline 10s), close steps that succeed/fail/hang. `request` transitions only from `Running` (`:79-80`); `execute` waits for a request, `claimExecution` once (`:88,153`), otherwise awaits `awaitComplete`; `raceDetachedShutdowns` interrupts the loser (`:134-144`). Graceful: drain with timeout+ignore, then `Effect.all([wire, telemetry, clients], {concurrency: 'unbounded'})` ignoring failures (`:108-121`). Forced: sleep deadline, diagnostic, `forceExit(1)`, `complete` (`:123-132`) — model `forceExit` as absorbing. Process wiring: `src/index.ts:132-176` (`acquireUseRelease` → `closeProcessClients` with 5s timeout, `:71-83`); stdio run loop races lifecycle events vs `stop` and always runs bounded shutdown in `ensuring` (`src/mcp/server.ts:264-270`). `StdioProcessPort` is injectable (`server.ts:67`)."
