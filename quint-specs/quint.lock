[[components.http-transport-admission.productIntent.hazards]]
claim = "It should be impossible to reach a state where MCP_AUTH_TOKEN is set but the HTTP server accepts requests with no bearer token because the configured value was whitespace."
decidedAt = 1789143333369
decision = "confirmed"
expectations = [
    "`activeAuthToken` trims the token and treats an empty result as no token configured",
    "`isAuthorizedMcpRequest` returns true when the expected token is undefined",
    "startup does not reject or warn about a blank `MCP_AUTH_TOKEN`",
]
headline = "Whitespace MCP_AUTH_TOKEN never disables auth"
id = "whitespace-mcp-auth-token-never-disables-auth"
quint = [
    "pure def activeToken(t) = if (trim(t) == \"\") None else Some(trim(t))",
    "action fetch(req) = response' = if (activeToken(env) == None or req.bearer == activeToken(env)) Dispatched else Unauthorized",
    "val tokenConfiguredMeansEnforced = envSet implies (response == Dispatched implies req.bearer == activeToken(env))",
]
recordedAt = 1789140962782
why = "An operator who believes the endpoint is token-protected would be exposing Huly tools, with the server's env credentials, to anyone who can reach the port."

