[[components.http-transport-admission.productIntent.hazards]]
claim = "It should always be possible for a later header-less request to start a fresh env-scoped Huly client acquisition after an earlier acquisition failed only with HulyUnavailableError, without restarting the process."
decidedAt = 1789144300458
decision = "confirmed"
expectations = [
    "a failure whose cause is only `HulyUnavailableError` clears `state.active`, so `r2` starts acquisition `a2`",
    "an unavailable failure combined with a defect or interrupt stays cached",
    "`HulyAuthError`, `HulyConnectionError` and config failures stay cached for the process lifetime; only `HulyUnavailableError` is evicted",
    "eviction only clears `state.active` if it still holds the failed acquisition",
]
headline = "Unavailable env failure doesn't poison shared client"
id = "unavailable-env-failure-doesn-t-poison-shared-client"
quint = [
    "type Failure = Unavailable | Auth | Connection | Config",
    "var active: Acquisition  // None | Acquiring(id) | Failed(e) | Ready(id)",
    "action acquisitionFails(e) = active' = if (e == Unavailable) None else Failed(e)",
    "action resolve(r) = all { active == None, active' = Acquiring(nextId) }",
    "val unavailableNeverCached = active != Failed(Unavailable)",
]
recordedAt = 1789143230649
source = "refined"
why = "A Huly outage would otherwise take every env-credentialed HTTP and stdio tool call down until someone restarts the server."

