claim = "It should be impossible to reach a state where two consecutive HTTP tool calls with identical x-huly-* headers each build and tear down their own Huly connection."
decidedAt = 1789144245583
decision = "confirmed"
expectations = [
    "`createHttpClientLeaseResolver` runs `buildScopedClientBundle` for every request that carries config headers",
    "the lease `close` is the scope close, run once when the per-request server closes",
    "only header-less requests reuse a connection (the shared env bundle)",
]
headline = "Repeat header-scoped calls don't reconnect to Huly each time"
id = "repeat-header-scoped-calls-don-t-reconnect-to-huly-each-time"
quint = [
    "action callTool(c) = if (c.headerMode) all { bundles' = bundles.put(c, fresh()), connects' = connects + 1 } else bundles' = bundles.put(c, shared)",
    "action serverClose(c) = closed' = closed.union(Set(bundles.get(c)))",
    "val reuseSameTenant = (c1.headers == c2.headers) implies bundles.get(c1) == bundles.get(c2)",
]
recordedAt = 1789141049665
why = "Per-request isolation is simple and leak-free, but every hosted-tenant tool call pays a full Huly connect and auth round trip."

