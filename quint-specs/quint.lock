claim = "It should be impossible to reach a state where HTTP shutdown closes the process-scoped Huly client while a header-less tool call admitted before shutdown is still using it."
decidedAt = 1789144270883
decision = "confirmed"
expectations = [
    "`mounted.close` wraps the `activeRequests` drain in `timeoutOrElse(shutdownGracePeriod)` whose fallback only writes a log line",
    "the env bundle lease close is a no-op, so the request holds no claim on the shared client",
    "`runConfiguredServer` releases the resolver via `closeProcessClients` right after the HTTP scope ends",
]
headline = "Shared client outlives in-flight HTTP tool calls at shutdown"
id = "shared-client-outlives-in-flight-http-tool-calls-at-shutdown"
quint = [
    "action graceElapsed = all { closeState == Draining, closeState' = TimedOut }",
    "action closeProcessClients = all { closeState == TimedOut, active' = Closed }",
    "val noCloseUnderUse = active == Closed implies requests.forall(r => r.bundle != SharedEnv or r.status != Running)",
]
recordedAt = 1789141061872
why = "A slow mutation interrupted mid-way by a closed connection can leave Huly partially updated with the caller seeing a transport error."

